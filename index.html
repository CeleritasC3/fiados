<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#6C171E">
<title>Go!i! coffee · Fiados</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bur:#6C171E;--bur2:#4A0F15;--burL:#F8EBED;--oro:#B7925D;--oroL:#FBF6EE;--surf:#F4F5F7;--blanco:#fff;--tinta:#1E232A;--suave:#6C757D;--linea:#E4E7EB;--ok:#1F7A57;--okL:#E6F4EE;--mal:#B3262F;--malL:#FCEDEE}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:"Plus Jakarta Sans",system-ui,"Segoe UI",sans-serif;background:var(--surf);color:var(--tinta);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
#app,#login{max-width:480px;margin:0 auto;min-height:100vh;background:var(--surf)}
#app{padding-bottom:88px}
button,input{font:inherit;color:inherit}
.oculto{display:none!important}
.num{font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--linea);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
header img{height:38px;display:block}
header small{display:block;color:var(--suave);font-size:12px;font-weight:500}
.iconbtn{border:1px solid var(--linea);background:var(--blanco);border-radius:12px;min-height:44px;padding:0 14px;font-weight:700;color:var(--bur);cursor:pointer}
.banda{background:var(--oro);color:#fff;font-size:12px;font-weight:700;text-align:center;padding:4px;letter-spacing:.04em}
main{padding:16px;display:grid;gap:14px}
.hero{background:linear-gradient(135deg,var(--bur),var(--bur2));color:#fff;border-radius:20px;padding:20px;position:relative;overflow:hidden;box-shadow:0 10px 24px rgba(108,23,30,.22)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.hero::before{width:130px;height:130px;right:-34px;bottom:-40px;background:rgba(255,255,255,.07)}
.hero::after{width:96px;height:96px;right:48px;top:-42px;background:rgba(183,146,93,.2)}
.hero>*{position:relative;z-index:1}
.hero small{text-transform:uppercase;letter-spacing:.08em;font-size:12px;font-weight:700;color:#F2D9DC}
.hero b{display:block;font-size:34px;font-weight:800;margin:2px 0 0;letter-spacing:-.02em}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.15)}
.mini div{background:rgba(255,255,255,.1);border-radius:12px;padding:8px 10px;font-size:12px;color:#F2D9DC}
.mini strong{display:block;color:#fff;font-size:15px;margin-top:2px}
.busca{display:flex;gap:8px}
input{width:100%;background:var(--blanco);border:1px solid var(--linea);border-radius:12px;padding:11px 14px;outline:none;min-height:46px}
input:focus{border-color:var(--bur);box-shadow:0 0 0 3px rgba(108,23,30,.14)}
label{display:block;font-size:13px;font-weight:600;color:var(--suave);margin:12px 0 4px}
.btn{border:0;border-radius:12px;background:var(--bur);color:#fff;font-weight:700;padding:0 16px;min-height:46px;cursor:pointer;white-space:nowrap}
.btn.sec{background:var(--blanco);color:var(--bur);border:1px solid var(--linea)}
.btn.ok{background:var(--ok)}.btn.wa{background:var(--okL);color:#0F5A3F;border:1px solid #BFE3D2}
.btn:disabled{opacity:.5}
.btn:active,.card:active{transform:scale(.98)}
:focus-visible{outline:3px solid var(--oro);outline-offset:2px}
.chips{display:flex;gap:8px;overflow-x:auto}
.chip{border:1px solid var(--linea);background:var(--blanco);color:#4B5563;border-radius:10px;padding:0 14px;min-height:38px;font-weight:700;font-size:14px;cursor:pointer}
.chip.on{background:var(--bur);border-color:var(--bur);color:#fff}
.card{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:var(--blanco);border:1px solid var(--linea);border-radius:16px;padding:12px;cursor:pointer;margin-bottom:10px}
.av{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--burL);color:var(--bur);flex:none}
.av.ok{background:var(--okL);color:var(--ok)}
.card .l{display:flex;align-items:center;gap:12px;min-width:0}
.card h4{margin:0;font-size:15px}.card small{color:var(--suave);font-size:13px}
.tag{border-radius:99px;padding:4px 10px;font-weight:800;font-size:13px;white-space:nowrap}
.tag.mal{background:var(--malL);color:var(--mal)}.tag.ok{background:var(--okL);color:var(--ok)}
.panel{background:var(--blanco);border:1px solid var(--linea);border-radius:16px;padding:16px}
.panel h3{margin:0 0 8px;font-size:15px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--linea);font-size:14px}
.kv:last-child{border:0}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(255,255,255,.97);border-top:1px solid var(--linea);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;background:none;border:0;padding:12px 0;font-weight:600;font-size:13px;color:#8A93A0;cursor:pointer}
nav button.on{color:var(--bur);font-weight:800;box-shadow:inset 0 3px 0 var(--oro)}
dialog{border:0;border-radius:20px;padding:20px;width:min(92vw,440px);color:var(--tinta);background:var(--blanco)}
dialog::backdrop{background:rgba(20,10,12,.55)}
dialog.sheet{margin:auto auto 0;width:100%;max-width:480px;border-radius:24px 24px 0 0;max-height:92vh}
dialog h2{margin:0;font-size:18px}
.fila2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.mes{font-size:12px;font-weight:800;color:var(--suave);text-transform:uppercase;letter-spacing:.07em;margin:16px 0 4px}
.mov{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;background:var(--surf);border-radius:10px;margin-bottom:6px;font-size:14px}
.mov small{display:block;color:var(--suave);font-size:12px}.mov.anul{opacity:.5;text-decoration:line-through}
.mov .x{background:none;border:0;color:var(--mal);font-size:12px;text-decoration:underline;padding:6px 0;cursor:pointer}
.msg{display:block;width:100%;text-align:left;background:var(--surf);border:1px solid var(--linea);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:14px;cursor:pointer;line-height:1.4}
.msg em{display:inline-block;font-style:normal;font-size:11px;font-weight:800;background:var(--oro);color:#fff;border-radius:6px;padding:1px 7px;margin-bottom:4px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--tinta);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;max-width:88vw;z-index:99}
.err{color:var(--mal);min-height:24px;font-size:14px}
.luz{position:fixed;z-index:60;border-radius:14px;box-shadow:0 0 0 9999px rgba(20,10,12,.72);pointer-events:none;transition:all .25s}
.tcard{position:fixed;left:50%;transform:translateX(-50%);width:min(92vw,440px);background:var(--blanco);border-radius:18px;padding:16px;z-index:61;box-shadow:0 12px 32px rgba(0,0,0,.35)}
.tcard h3{margin:0 0 4px;font-size:17px;color:var(--bur)}.tcard p{margin:0;font-size:15px}
.tcard .pie{display:flex;align-items:center;gap:8px;margin-top:14px}.tcard .pie span{flex:1;font-size:12px;color:var(--suave)}
.tfondo{position:fixed;inset:0;z-index:59;background:rgba(20,10,12,.72)}
.demo{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.ver{position:fixed;right:8px;bottom:62px;font-size:10px;opacity:.35}
</style>
</head>

</div>

<dialog id="dDet" class="sheet"></dialog>
<dialog id="dMov"><h2 id="dMovT"></h2>
  <label for="mMonto">Monto en pesos</label><input id="mMonto" type="number" inputmode="numeric" min="1">
  <label for="mNota">Detalle (opcional)</label><input id="mNota" placeholder="Ej.: café y medialuna">
  <label for="mFecha">Fecha</label><input id="mFecha" type="date">
  <div class="fila2"><button class="btn sec" data-cerrar>Cancelar</button><button class="btn" id="mOk">Guardar</button></div></dialog>
<dialog id="dCli"><h2>Nuevo cliente</h2>
  <label for="cNom">Nombre</label><input id="cNom" autocomplete="off">
  <label for="cTel">Teléfono (para WhatsApp, opcional)</label><input id="cTel" type="tel" inputmode="tel" placeholder="9 1234 5678">
  <div class="fila2"><button class="btn sec" data-cerrar>Cancelar</button><button class="btn" id="cOk">Agregar cliente</button></div></dialog>
<dialog id="dWa"><h2 id="dWaT">Enviar saldo por WhatsApp</h2><p style="color:var(--suave);font-size:14px;margin:4px 0 0">Toca el mensaje que quieres enviar. Se abrirá WhatsApp para que lo revises antes de mandarlo.</p><div id="waLista"></div>
  <button class="btn sec" data-cerrar style="width:100%;margin-top:12px">Cancelar</button></dialog>
<div class="ver" id="ver"></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbyC-gcSqLZ8eWtr6xNjVWiiHAY9bzjemjo3BR9SmXqS98rdbcFa7FtZg_2pCW22oPH4Wg/exec';
const VERSION = 5, LOCAL = 'Go!i! coffee';
const MENSAJES = [
  '¡Hola {n}! ¿Cómo estás? Te escribimos de {L} para recordarte que tu cuenta tiene un saldo pendiente de {s}. ¡Gracias por tu preferencia!',
  'Hola {n} ☕ Pasamos a avisarte que tu saldo en {L} es de {s}. Cuando puedas, te esperamos por acá. ¡Que tengas un lindo día!',
  'Buenas, {n}. Te contamos que el total de tu cuenta en {L} es {s}. Si ya lo pagaste, ignora este mensaje y disculpa la molestia.',
  '¡Hola {n}! Desde {L} te recordamos amablemente tu saldo pendiente: {s}. Puedes pasar a pagarlo cuando quieras. ¡Gracias!',
  '{n}, ¿cómo va todo? Un recordatorio cordial de {L}: tienes {s} por pagar. Si necesitas coordinar el pago, respóndenos por este chat.'
];
const SALDADAS = [
  '¡Hola {n}! Te escribimos de {L} para confirmarte que tu cuenta está al día. ¡Muchas gracias por tu pago!',
  'Hola {n} ☕ Tu cuenta en {L} quedó saldada. ¡Gracias por tu preferencia, te esperamos pronto!',
  'Buenas, {n}. Te avisamos que ya no tienes saldo pendiente en {L}. ¡Gracias por ponerte al día!',
  '¡Hola {n}! Desde {L} queremos agradecerte: tu cuenta está en cero. ¡Que tengas un excelente día!',
  '{n}, ¡todo en orden! Tu cuenta en {L} está saldada. Gracias por tu pago y por elegirnos.'
];
const S = { u: '', pin: '', nombre: '', rol: '', cl: [], mv: [], vista: 'clientes', sel: null, filtro: 'all', q: '' };
const $ = s => document.querySelector(s);
const clp = n => (n < 0 ? '-' : '') + '$' + Math.abs(Math.round(n)).toLocaleString('es-CL');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const hoy = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const esJefe = () => S.rol === 'jefe' || S.rol === 'dev';
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const nombreMes = m => MESES[+m.slice(5) - 1] + ' ' + m.slice(0, 4);
const iniciales = n => n.split(/\s+/).map(p => p[0]).slice(0, 2).join('').toUpperCase();
const toast = t => { const e = document.createElement('div'); e.className = 'toast'; e.textContent = t; document.body.append(e); setTimeout(() => e.remove(), 3200); };

async function api(accion, datos = {}) {
  let j;
  try { j = await (await fetch(API, { method: 'POST', body: JSON.stringify({ usuario: S.u, pin: S.pin, accion, ...datos }) })).json(); }
  catch (e) { throw new Error('No hay conexión con la planilla. Revisa el internet e intenta de nuevo.'); }
  if (!j.ok) throw new Error(j.error);
  return j;
}
async function cargar() {
  const j = await api('datos');
  Object.assign(S, { nombre: j.nombre, rol: j.rol, cl: j.clientes, mv: j.movimientos });
  render();
  if (S.abrir) { S.abrir = false; abrirDet(S.sel); }
}
function saldos() {
  const m = {};
  S.mv.filter(x => !x.anulado).forEach(x => m[x.clienteId] = (m[x.clienteId] || 0) + (x.tipo === 'fiado' ? 1 : -1) * Number(x.monto));
  return m;
}
function render() {
  $('#quien').textContent = S.nombre + ' · ' + { jefe: 'Jefe', empleado: 'Empleado', dev: 'Desarrollo' }[S.rol];
  $('#banda').classList.toggle('oculto', S.rol !== 'dev');
  $('#nResumen').classList.toggle('oculto', !esJefe());
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === S.vista));
  $('#main').innerHTML = { clientes: vClientes, resumen: vResumen, mas: vMas }[S.vista]();
  if ($('#dDet').open) pintaDet();
}

function vClientes() {
  const s = saldos(), v = Object.values(s);
  const total = v.reduce((a, b) => a + b, 0), con = v.filter(x => x > 0).length, alDia = S.cl.length - con;
  const ch = [['all', 'Todos'], ['deuda', 'Con deuda'], ['aldia', 'Al día']].map(([k, t]) => `<button class="chip ${S.filtro === k ? 'on' : ''}" onclick="S.filtro='${k}';render()">${t}</button>`).join('');
  return `<div class="hero"><small>Total por cobrar</small><b class="num">${clp(total)}</b>
  <div class="mini"><div>Con saldo pendiente<strong>${con} cliente${con !== 1 ? 's' : ''}</strong></div><div>Cuentas al día<strong>${alDia} cliente${alDia !== 1 ? 's' : ''}</strong></div></div></div>
  <div class="busca"><input id="q" placeholder="Buscar por nombre o teléfono" value="${esc(S.q)}" oninput="S.q=this.value;pintaLista()" aria-label="Buscar cliente"><button class="btn" onclick="abrirCli()">+ Cliente</button></div>
  <div class="chips">${ch}</div><div id="lista">${filas(s)}</div>`;
}
function filas(s) {
  const q = S.q.toLowerCase().trim();
  const l = S.cl.filter(c => (c.nombre.toLowerCase().includes(q) || c.telefono.includes(q)) && (S.filtro === 'all' || (S.filtro === 'deuda') === ((s[c.id] || 0) > 0)))
    .sort((a, b) => (s[b.id] || 0) - (s[a.id] || 0) || a.nombre.localeCompare(b.nombre));
  if (!l.length) return `<div class="panel" style="text-align:center;color:var(--suave)">${S.cl.length ? 'No se encontraron clientes.' : 'Aún no hay clientes. Toca «+ Cliente» para agregar el primero.'}</div>`;
  return l.map(c => { const d = s[c.id] || 0; return `<button class="card" onclick="abrirDet('${c.id}')"><span class="l"><span class="av ${d > 0 ? '' : 'ok'}">${esc(iniciales(c.nombre))}</span><span><h4>${esc(c.nombre)}</h4><small>${esc(c.telefono) || 'Sin teléfono'}</small></span></span><span class="tag ${d > 0 ? 'mal' : 'ok'} num">${d > 0 ? 'Debe ' + clp(d) : 'Al día'}</span></button>`; }).join('');
}
function pintaLista() { $('#lista').innerHTML = filas(saldos()); }

function abrirDet(id) { S.sel = id; pintaDet(); $('#dDet').showModal(); }
function pintaDet() {
  const c = S.cl.find(x => x.id === S.sel); if (!c) { $('#dDet').close(); return; }
  const d = saldos()[c.id] || 0;
  const movs = S.mv.filter(m => m.clienteId === c.id).sort((a, b) => (b.fecha + b.hora).localeCompare(a.fecha + a.hora));
  let h = `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div style="display:flex;align-items:center;gap:12px;min-width:0"><span class="av ${d > 0 ? '' : 'ok'}">${esc(iniciales(c.nombre))}</span><div><h2>${esc(c.nombre)}</h2><small style="color:var(--suave)">${esc(c.telefono) || 'Sin teléfono'}</small></div></div><button class="iconbtn" onclick="$('#dDet').close()" aria-label="Cerrar">✕</button></div>
  <div class="panel" style="margin:14px 0;background:var(--surf);display:flex;justify-content:space-between;align-items:center"><div><small style="color:var(--suave)">Saldo pendiente</small><div class="num" style="font-size:26px;font-weight:800;color:var(--bur)">${clp(d)}</div></div><span class="tag ${d > 0 ? 'mal' : 'ok'}">${d > 0 ? 'Con deuda' : 'Al día'}</span></div>
  <div class="fila2" style="margin:0 0 10px"><button class="btn ok" onclick="abrirMov('pago')">Registrar pago</button><button class="btn" onclick="abrirMov('fiado')">Cargar fiado</button></div>
  ${c.telefono ? `<button class="btn wa" style="width:100%" onclick="abrirWa()">${d > 0 ? 'Enviar saldo por WhatsApp' : 'Avisar por WhatsApp que está al día'}</button>` : ''}`;
  let mes = '';
  movs.forEach(m => {
    if (m.mes !== mes) { mes = m.mes; h += `<div class="mes">${nombreMes(mes)}</div>`; }
    const x = esJefe() && !m.anulado ? ` · <button class="x" onclick="anular('${m.id}')">Anular</button>` : '';
    h += `<div class="mov ${m.anulado ? 'anul' : ''}"><span>${m.fecha.slice(8)}/${m.fecha.slice(5, 7)} · ${esc(m.nota) || (m.tipo === 'fiado' ? 'Fiado' : 'Pago')}<small>${esc(m.usuario)}${m.anulado ? ' · anulado por ' + esc(m.anuladoPor) : ''}${x}</small></span><b class="num" style="color:${m.tipo === 'pago' ? 'var(--ok)' : 'var(--tinta)'}">${m.tipo === 'fiado' ? '+' : '−'}${clp(m.monto)}</b></div>`;
  });
  $('#dDet').innerHTML = h + (movs.length ? '' : '<p style="color:var(--suave)">Sin movimientos todavía.</p>');
}

/* WhatsApp: 5 mensajes; sugiere uno distinto al último enviado a ese cliente */
function textoWa(i, c, d) { return (d > 0 ? MENSAJES : SALDADAS)[i].replace('{n}', c.nombre.split(/\s+/)[0]).replace('{L}', LOCAL).replace('{s}', clp(d)); }
function abrirWa() {
  const c = S.cl.find(x => x.id === S.sel), d = saldos()[c.id] || 0;
  let ult = -1; try { ult = +localStorage.getItem((d > 0 ? 'wa:' : 'wo:') + c.id); if (isNaN(ult)) ult = -1; } catch (e) {}
  const sug = (ult + 1 + Math.floor(Math.random() * 4)) % 5; // nunca igual al último
  $('#dWaT').textContent = d > 0 ? 'Enviar saldo por WhatsApp' : 'Avisar que la cuenta está al día';
  $('#waLista').innerHTML = MENSAJES.map((_, i) => `<button class="msg" onclick="enviarWa(${i})">${i === sug ? '<em>Sugerido</em><br>' : ''}${esc(textoWa(i, c, d))}</button>`).join('');
  $('#dWa').showModal();
}
function enviarWa(i) {
  const c = S.cl.find(x => x.id === S.sel), d = saldos()[c.id] || 0;
  let t = c.telefono.replace(/\D/g, '');
  t = t.startsWith('56') ? t : t.length === 8 ? '569' + t : '56' + t;
  try { localStorage.setItem((d > 0 ? 'wa:' : 'wo:') + c.id, i); } catch (e) {}
  $('#dWa').close();
  window.open('https://wa.me/' + t + '?text=' + encodeURIComponent(textoWa(i, c, d)), '_blank');
}

function vResumen() {
  const act = S.mv.filter(m => !m.anulado), s = saldos(), mesAct = hoy().slice(0, 7), pm = {};
  act.forEach(m => { const o = pm[m.mes] ||= { f: 0, p: 0 }; o[m.tipo === 'fiado' ? 'f' : 'p'] += Number(m.monto); });
  const meses = Object.keys(pm).sort().reverse();
  const deud = S.cl.map(c => [c.nombre, s[c.id] || 0]).filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const tr = {}; act.filter(m => m.mes === mesAct && m.tipo === 'fiado').forEach(m => tr[m.usuario] = (tr[m.usuario] || 0) + Number(m.monto));
  const total = Object.values(s).reduce((a, b) => a + b, 0);
  const kv = (a, b) => `<div class="kv"><span>${esc(a)}</span><b class="num">${b}</b></div>`;
  return `<div class="hero"><small>Pendiente total</small><b class="num">${clp(total)}</b></div>
  <div class="panel"><h3>Por mes (fiados / pagos)</h3>${meses.map(m => kv(nombreMes(m), clp(pm[m].f) + ' / ' + clp(pm[m].p))).join('') || '<small>Sin datos.</small>'}</div>
  <div class="panel"><h3>Quienes más deben</h3>${deud.map(d => kv(d[0], clp(d[1]))).join('') || '<small>Nadie debe nada.</small>'}</div>
  <div class="panel"><h3>Fiado este mes por trabajador</h3>${Object.entries(tr).map(t => kv(t[0], clp(t[1]))).join('') || '<small>Sin fiados este mes.</small>'}</div>`;
}
function vMas() {
  return `<div class="panel"><h3>Tutorial</h3><p style="margin:0 0 12px;color:var(--suave);font-size:14px">Un paseo corto por la app que explica cada función paso a paso.</p><button class="btn" onclick="tour()">Comenzar tutorial</button></div>
  <div class="panel"><h3>Sesión</h3><p style="margin:0 0 12px">Conectado como <b>${esc(S.nombre)}</b>.</p><button class="btn sec" onclick="salir()">Cerrar sesión</button></div>
  ${esJefe() ? `<div class="panel"><h3>Limpieza de meses antiguos</h3><p style="margin:0 0 12px;color:var(--suave);font-size:14px">Se guardan los últimos 4 meses (el actual y los 3 anteriores). Esto borra solo lo antiguo que ya está saldado entre sí (un fiado viejo y su pago, ambos de hace más de 4 meses). Las deudas que siguen vivas no se tocan.</p><button class="btn" style="background:var(--mal)" onclick="purgar()">Borrar meses de más de 4 atrás</button></div>` : ''}`;
}


/* Tutorial guiado */
const PASOS = [
  { t: '¡Bienvenido!', x: 'Este paseo te enseña, paso a paso, para qué sirve cada parte de la app. No cambia ningún dato: puedes tocar «Siguiente» con tranquilidad.' },
  { v: 'clientes', s: '.hero', t: 'Total por cobrar', x: 'Aquí ves cuánto dinero te deben en total. Abajo aparecen cuántos clientes tienen deuda y cuántos están al día.' },
  { v: 'clientes', s: '.busca', t: 'Buscar y agregar clientes', x: 'Escribe un nombre o teléfono para encontrar a alguien rápido. El botón «+ Cliente» sirve para registrar a una persona nueva la primera vez que fía.' },
  { v: 'clientes', s: '.chips', t: 'Filtros', x: '«Con deuda» muestra solo a quienes deben plata. «Al día» muestra a quienes ya pagaron todo. «Todos» muestra la lista completa.' },
  { v: 'clientes', s: '.card', t: 'La ficha de cada cliente', x: 'Toca un cliente para abrir su ficha. Ahí está todo lo suyo: cuánto debe y su historial día por día.', alt: 'Cuando agregues tu primer cliente, tócalo para abrir su ficha: ahí está cuánto debe y su historial día por día.' },
  { v: 'clientes', t: 'Cargar fiado y registrar pago', x: 'Dentro de la ficha hay dos botones. Usa «Cargar fiado» cuando el cliente se lleva algo sin pagar, y «Registrar pago» cuando paga todo o una parte.', demo: '<button class="btn">Cargar fiado</button><button class="btn ok">Registrar pago</button>' },
  { v: 'clientes', t: 'Avisar por WhatsApp', x: 'Si el cliente tiene teléfono, la ficha muestra este botón. Te deja elegir entre 5 mensajes ya escritos para cobrar con amabilidad, o para avisar que su cuenta quedó al día. Antes de enviarlo, WhatsApp te lo muestra para que lo revises.', demo: '<button class="btn wa">Enviar saldo por WhatsApp</button>' },
  { v: 'clientes', s: '#sync', t: 'Actualizar', x: 'Si otra persona del equipo anotó algo, toca «Actualizar» para ver sus cambios en tu teléfono.' },
  { v: 'resumen', s: '[data-v=resumen]', t: 'Resumen', x: 'Aquí ves cuánto se fió y cuánto se pagó cada mes, quiénes deben más y cuánto ha anotado cada trabajador.', jefe: 1 },
  { v: 'clientes', t: 'Anular un movimiento', x: 'Si alguien se equivocó, en la ficha del cliente toca «Anular» junto al movimiento. No se borra: queda tachado, con el nombre de quién lo anuló.', jefe: 1, demo: '<span class="mov anul" style="margin:0">12/11 · Café · $2.500</span><span style="font-size:12px;color:var(--mal);text-decoration:underline">Anular</span>' },
  { v: 'mas', s: '[data-v=mas]', t: 'La sección «Más»', x: 'Aquí está este tutorial, el botón para cerrar sesión y, solo para jefes, la limpieza de meses antiguos que borra lo de hace más de 4 meses que ya está saldado, sin tocar las deudas vivas.', jefe: 1 },
  { v: 'mas', s: '[data-v=mas]', t: 'La sección «Más»', x: 'Aquí encuentras este tutorial y el botón para cerrar sesión cuando termines de usar la app.' },
  { t: '¡Listo!', x: 'Ya conoces lo esencial. Cuando quieras repetirlo, vuelve a «Más» y toca «Comenzar tutorial».' }
];
let tI = 0, tL = [];
function tour() { tL = PASOS.filter(p => esJefe() ? !(p.jefe === undefined && p.t === 'La sección «Más»' && p.x.startsWith('Aquí encuentras')) : !p.jefe); tI = 0; tPaso(); }
function tFin() { ['.luz', '.tcard', '.tfondo'].forEach(s => document.querySelectorAll(s).forEach(e => e.remove())); S.vista = 'mas'; render(); scrollTo(0, 0); }
function tPaso() {
  ['.luz', '.tcard', '.tfondo'].forEach(s => document.querySelectorAll(s).forEach(e => e.remove()));
  const p = tL[tI];
  if (p.v && p.v !== S.vista) { S.vista = p.v; render(); }
  const el = p.s ? document.querySelector(p.s) : null;
  if (el) el.scrollIntoView({ block: 'center' });
  const card = document.createElement('div'); card.className = 'tcard'; card.setAttribute('role', 'dialog');
  card.innerHTML = `<h3>${p.t}</h3><p>${el || !p.alt ? p.x : p.alt}</p>${p.demo ? `<div class="demo">${p.demo}</div>` : ''}<div class="pie"><span>${tI + 1} de ${tL.length}</span><button class="btn sec" onclick="tFin()">Salir</button>${tI ? '<button class="btn sec" onclick="tI--;tPaso()">Anterior</button>' : ''}<button class="btn" onclick="${tI < tL.length - 1 ? 'tI++;tPaso()' : 'tFin()'}">${tI < tL.length - 1 ? 'Siguiente' : 'Terminar'}</button></div>`;
  if (el) {
    const r = el.getBoundingClientRect(), l = document.createElement('div'); l.className = 'luz';
    Object.assign(l.style, { left: r.left - 6 + 'px', top: r.top - 6 + 'px', width: r.width + 12 + 'px', height: r.height + 12 + 'px' });
    document.body.append(l);
    card.style[r.top + r.height / 2 > innerHeight * .5 ? 'top' : 'bottom'] = r.top + r.height / 2 > innerHeight * .5 ? '16px' : '16px';
  } else { const f = document.createElement('div'); f.className = 'tfondo'; document.body.append(f); card.style.top = '50%'; card.style.transform = 'translate(-50%,-50%)'; }
  document.body.append(card);
}

/* Acciones */
let tipoMov = '';
function abrirMov(t) { tipoMov = t; $('#dMovT').textContent = t === 'fiado' ? 'Cargar fiado' : 'Registrar pago'; $('#mMonto').value = ''; $('#mNota').value = ''; $('#mFecha').value = hoy(); $('#dMov').showModal(); $('#mMonto').focus(); }
function abrirCli() { $('#cNom').value = ''; $('#cTel').value = ''; $('#dCli').showModal(); $('#cNom').focus(); }
async function guarda(btn, fn) { btn.disabled = true; try { await fn(); await cargar(); } catch (e) { toast(e.message); } btn.disabled = false; }
$('#mOk').onclick = e => guarda(e.target, async () => {
  await api('mov', { clienteId: S.sel, tipo: tipoMov, monto: $('#mMonto').value, nota: $('#mNota').value, fecha: $('#mFecha').value });
  $('#dMov').close(); toast(tipoMov === 'fiado' ? 'Fiado anotado' : 'Pago registrado');
});
$('#cOk').onclick = e => guarda(e.target, async () => {
  const j = await api('cliente', { nombre: $('#cNom').value, telefono: $('#cTel').value });
  $('#dCli').close(); S.sel = j.id; S.abrir = true; toast('Cliente agregado');
});
async function anular(id) { if (confirm('¿Anular este movimiento? Quedará tachado en el historial, no se borra.')) try { await api('anular', { id }); await cargar(); toast('Movimiento anulado'); } catch (e) { toast(e.message); } }
async function purgar() { if (confirm('¿Borrar los movimientos de más de 4 meses atrás? Solo se borran los antiguos que ya están saldados entre sí. Esto no se puede deshacer.')) try { const j = await api('purgar'); await cargar(); toast(j.borrados + ' movimientos borrados' + (j.conservados ? ' · ' + j.conservados + ' cliente(s) con algo viejo sin saldar se conservó' : '')); } catch (e) { toast(e.message); } }
document.querySelectorAll('[data-cerrar]').forEach(b => b.onclick = () => b.closest('dialog').close());
document.querySelectorAll('nav button').forEach(b => b.onclick = () => { S.vista = b.dataset.v; render(); scrollTo(0, 0); });
$('#sync').onclick = () => cargar().then(() => toast('Datos actualizados')).catch(e => toast(e.message));

/* Sesión */
async function entrar() {
  $('#lerr').textContent = ''; $('#entrar').disabled = true;
  S.u = $('#u').value.trim(); S.pin = $('#p').value;
  try {
    await cargar();
    try { localStorage.setItem('usuario', S.u); sessionStorage.setItem('pin', S.pin); sessionStorage.setItem('u', S.u); } catch (e) {}
    $('#login').classList.add('oculto'); $('#app').classList.remove('oculto');
  } catch (e) { $('#lerr').textContent = e.message; }
  $('#entrar').disabled = false;
}
function salir() { try { sessionStorage.clear(); } catch (e) {} location.reload(); }
$('#entrar').onclick = entrar;
$('#p').onkeydown = e => { if (e.key === 'Enter') entrar(); };
$('#ver').textContent = 'v' + VERSION;
try { $('#u').value = sessionStorage.getItem('u') || localStorage.getItem('usuario') || ''; const pin = sessionStorage.getItem('pin'); if (pin && $('#u').value) { $('#p').value = pin; entrar(); } } catch (e) {}
</script>
